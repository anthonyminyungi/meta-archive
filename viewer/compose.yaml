# TrueNAS SCALE Custom App YAML (Docker Compose)
# 주의:
# 1. 배포 전 아래 두 곳의 <pool>을 실제 TrueNAS ZFS 풀 이름(예: tank)으로 변경하세요.
# 2. TrueNAS SCALE Apps 엔진 제약상 build.context 에 상대 경로('.')를 사용하면 실패하므로
#    반드시 절대 호스트 경로(/mnt/<pool>/meta-archive/viewer)를 유지하세요.
# 3. 별도 앱 로그인 기능이 없으므로 LAN 또는 Tailscale 내부망 전용으로만 노출하세요.

services:
  meta-archive-viewer:
    build:
      context: /mnt/<pool>/meta-archive/viewer
      dockerfile: Dockerfile
    image: meta-archive-viewer:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # TrueNAS 데이터셋 권한이 특정 UID/GID(예: apps=568) 전용인 경우 아래 주석을 해제하세요.
    # user: "568:568"
    ports:
      - "8080:8080"
    environment:
      - ARCHIVE_DIR=/data/archive
      - TZ=Asia/Seoul
    volumes:
      - /mnt/<pool>/meta-archive/archive:/data/archive:ro
