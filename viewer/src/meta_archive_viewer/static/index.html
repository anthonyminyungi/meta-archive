<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meta Archive — 개인 아카이브</title>
    <link
      rel="preload"
      href="/static/fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/static/styles.css?v=4" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#/memories">
          <span class="brand-title">Meta Archive</span>
          <span class="brand-sep" aria-hidden="true"></span>
          <span id="overview-badge" class="brand-stats tabular">불러오는 중</span>
        </a>
        <nav class="nav-tabs" aria-label="주 메뉴">
          <a class="nav-tab" data-route="memories" href="#/memories">Memories</a>
          <a class="nav-tab" data-route="instagram" href="#/instagram">Instagram</a>
          <a class="nav-tab" data-route="facebook" href="#/facebook">Facebook</a>
          <a class="nav-tab" data-route="messages" href="#/messages">Messages</a>
          <a class="nav-tab" data-route="search" href="#/search">Search</a>
        </nav>
        <div class="topbar-actions">
          <button
            id="theme-toggle"
            class="icon-btn"
            type="button"
            aria-label="라이트/다크 테마 전환"
            title="라이트/다크 테마 전환"
          ></button>
        </div>
      </div>
    </header>

    <main id="app-main" class="app-main">
      <div class="loading-box">아카이브를 불러오는 중입니다...</div>
    </main>

    <div id="modal-root" class="overlay hidden" role="dialog" aria-modal="true"></div>
    <div id="lightbox-root" class="overlay lightbox-overlay hidden" role="dialog" aria-modal="true"></div>
    <div id="drawer-root" class="drawer-overlay hidden" role="dialog" aria-modal="true"></div>

    <script type="module" src="/static/js/app.js?v=4"></script>
  </body>
</html>
